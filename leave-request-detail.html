<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/openrouter-config.local.js" defer></script>
  <script src="js/ai.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/leave-request-detail.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>รายละเอียดใบลา</h1>

    <div id="กล่องใบลา" class="card">
      <p>กำลังโหลดข้อมูล…</p>
    </div>

    <div id="กล่องสรุปAI" class="card hidden">
      <h2>สรุปโดย AI</h2>
      <div id="เตือนสรุปAI" class="alert alert-error hidden"></div>
      <p id="ข้อความสรุปAI" class="hint hidden"></p>
      <div class="btn-row">
        <button type="button" id="ปุ่มสรุปAI">🤖 ให้ AI ช่วยสรุปใบลา</button>
      </div>
    </div>

    <div id="กล่องความเห็น" class="card hidden">
      <h2>ความเห็นการอนุมัติ</h2>
      <div id="รายการความเห็น"></div>

      <div id="กล่องเขียนความเห็น">
        <label for="ข้อความความเห็น">เขียนความเห็นใหม่</label>
        <textarea id="ข้อความความเห็น" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
        <div id="เตือนความเห็น" class="alert alert-error hidden"></div>
        <div class="btn-row">
          <button type="button" id="ปุ่มส่งความเห็น">ส่งความเห็น</button>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="leave-requests.html">← กลับไปหน้ารายการ</a>
    </div>
  </div>
</body>
</html>
